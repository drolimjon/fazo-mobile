<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Fazo">
<title>Fazo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#101010;--pan:#161616;--pop:#1c1c1c;--bd:#2a2a2e;--hv:#2a2a2e;--tx:#d1d4dc;--mu:#787b86;--up:#089981;--dn:#f23645;--bl:#2962ff;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px -apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:#0c0c0c;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;width:100%;outline:none;user-select:text;-webkit-user-select:text}
input:focus,select:focus{border-color:var(--bl)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:var(--st) var(--sr) 0 var(--sl)}
/* верхняя панель */
#top{height:46px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:1px solid var(--bd);background:var(--bg)}
#top .b{height:36px;min-width:36px;padding:0 9px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:600;white-space:nowrap}
#top .b:active,#top .b.on{background:var(--hv)}
#top .b svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
#symBtn{flex:0 1 auto;overflow:hidden;max-width:46%}
#symBtn span{overflow:hidden;text-overflow:ellipsis}
#symBtn small{color:var(--mu);font-weight:400;font-size:11px}
#top .sp{flex:1}
#top .sep{width:1px;height:22px;background:var(--bd);margin:0 2px}
/* страницы */
#pages{flex:1;position:relative;min-height:0}
.page{position:absolute;inset:0;display:none;flex-direction:column}
.page.on{display:flex}
#pgChart{background:var(--bg)}
#chartWrap{flex:1;position:relative;min-height:120px}
#chart{position:absolute;inset:0}
#subs{flex:none;display:flex;flex-direction:column}
#subs .sub{height:110px;position:relative;border-top:1px solid var(--bd)}
#subs .sub .lg{position:absolute;left:8px;top:4px;z-index:3;font-size:11px;color:var(--mu);pointer-events:none}
#legend{position:absolute;left:8px;top:6px;z-index:3;pointer-events:none;font-size:12px;line-height:1.5;max-width:calc(100% - 80px)}
#legend .t{font-weight:600;font-size:13px}
#legend .t small{color:var(--mu);font-weight:400}
#legend .o{color:var(--mu)} #legend .o b{font-weight:400}
#legend .il{color:var(--mu);font-size:11px}
#flogo{position:absolute;left:12px;bottom:36px;width:66px;height:26px;z-index:2;pointer-events:none;opacity:.55}
#flogo path{fill:#fff}
#loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:4;pointer-events:none}
#loading.on{display:flex}
.spin{width:28px;height:28px;border:3px solid #333;border-top-color:var(--bl);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#chartMsg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:4;background:var(--pop);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;max-width:86%;text-align:center;display:none;line-height:1.45}
#chartMsg.on{display:block}
#chartMsg button{margin-top:10px;background:var(--bl);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600}
#drawHint{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:5;background:var(--bl);color:#fff;border-radius:16px;padding:6px 12px;font-size:12px;display:none;white-space:nowrap}
#drawHint.on{display:block}
/* быстрые кнопки покупки/продажи справа внизу — не в этой версии */
/* списки */
.list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.hd{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-bottom:1px solid var(--bd);flex:none}
.hd h2{font-size:17px;margin:0;flex:1}
.hd .btn{height:34px;padding:0 12px;border-radius:8px;background:var(--hv);font-weight:600;display:flex;align-items:center;gap:6px}
.hd .btn.pri{background:var(--bl);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:0 14px;height:58px;border-bottom:1px solid #1c1c1c}
.row:active{background:#151515}
.row .ic{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .pr{text-align:right;font-variant-numeric:tabular-nums}
.row .pr b{display:block;font-size:15px;font-weight:600}
.row .pr span{display:inline-block;margin-top:2px;font-size:12px;padding:1px 6px;border-radius:4px;color:#fff;min-width:58px;text-align:center}
.row .x{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--dn);font-size:18px}
.row .dr{width:30px;color:var(--mu);text-align:center;font-size:18px;touch-action:none}
.up{color:var(--up)} .dn{color:var(--dn)}
.bgu{background:var(--up)} .bgd{background:var(--dn)} .bgn{background:#363a45}
.empty{color:var(--mu);text-align:center;padding:40px 20px;line-height:1.6}
.sec{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:16px 14px 6px}
.card{margin:0 12px 10px;background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}
.card label:first-child{margin-top:0}
.card .note{color:var(--mu);font-size:12px;line-height:1.5;margin-top:8px}
.card .note a{color:#5b8cff}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btns button{flex:1;height:40px;border-radius:8px;background:var(--hv);font-weight:600;min-width:120px}
.btns button.pri{background:var(--bl);color:#fff}
.seg{display:flex;background:#0c0c0c;border:1px solid var(--bd);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;height:34px;border-radius:6px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--hv);color:var(--tx)}
.st{font-size:12px;margin-top:10px;padding:8px 10px;border-radius:8px;background:#0c0c0c;line-height:1.5;word-break:break-word}
.st.ok{color:var(--up)} .st.er{color:var(--dn)}
/* нижняя навигация */
#nav{flex:none;display:flex;border-top:1px solid var(--bd);background:var(--bg);padding-bottom:var(--sb)}
#nav button{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mu)}
#nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
#nav button.on{color:var(--tx)}
#nav button.on svg{stroke:var(--bl)}
/* нижние листы */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none}
#ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--pop);border-radius:16px 16px 0 0;max-height:86vh;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .22s ease;padding-bottom:var(--sb);border-top:1px solid var(--bd)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:#444;margin:8px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;padding:6px 14px 10px;gap:8px;flex:none}
.sheet .sh h3{margin:0;font-size:16px;flex:1}
.sheet .sh .cl{width:32px;height:32px;border-radius:50%;background:var(--hv);font-size:15px}
.sheet .sb{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px}
.grid button{height:44px;border-radius:8px;background:#242424;font-weight:600}
.grid button.on{background:var(--bl);color:#fff}
.opt{display:flex;align-items:center;gap:12px;padding:0 16px;height:50px;width:100%;text-align:left}
.opt:active{background:var(--hv)}
.opt.on{color:#5b8cff}
.opt svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;flex:none}
.opt .r{margin-left:auto;color:var(--mu);font-size:12px}
.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;flex:none}
.tabs button{height:32px;padding:0 12px;border-radius:16px;background:#242424;white-space:nowrap;font-size:13px;font-weight:600}
.tabs button.on{background:var(--bl);color:#fff}
.srch{padding:0 14px 10px;flex:none}
.ind{border-bottom:1px solid #262626;padding:10px 16px}
.ind .h{display:flex;align-items:center;gap:10px}
.ind .h b{flex:1}
.ind .h small{color:var(--mu);font-weight:400}
.ind .ps{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ind .ps div{flex:1;min-width:70px}
.ind .ps span{display:block;font-size:11px;color:var(--mu);margin-bottom:3px}
.ind .ps input{padding:7px 8px}
.ind .ps input[type=color]{padding:2px;height:34px}
.sw{width:44px;height:26px;border-radius:13px;background:#3a3a3e;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--bl)} .sw.on::after{left:21px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 56px);transform:translateX(-50%) translateY(-20px);opacity:0;z-index:80;background:#2a2a2e;color:#fff;border-radius:10px;padding:10px 14px;
  font-size:13px;transition:all .2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%)}
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
#splash img{width:min(88vw,620px);border-radius:12px}
#splash.off{opacity:0;pointer-events:none}
@media (orientation:landscape) and (max-height:500px){#nav button{height:42px;flex-direction:row;gap:6px}#subs .sub{height:80px}}
</style>
</head>
<body>
<div id="splash"><img src="splash.jpg" alt=""></div>
<div id="app">
  <div id="top">
    <button class="b" id="symBtn"><span id="symTxt">BTCUSDT</span><small id="srcTxt"></small></button>
    <div class="sep"></div>
    <button class="b" id="tfBtn">1h</button>
    <button class="b" id="typeBtn" aria-label="type"><svg viewBox="0 0 24 24"><path d="M7 4v3M7 17v3M17 7v3M17 16v4"/><rect x="5" y="7" width="4" height="10"/><rect x="15" y="10" width="4" height="6"/></svg></button>
    <button class="b" id="indBtn" aria-label="indicators"><svg viewBox="0 0 24 24"><path d="M4 18c3-8 5-8 7-3s4 4 9-9"/><path d="M14 6h6v6" /></svg></button>
    <button class="b" id="drawBtn" aria-label="draw"><svg viewBox="0 0 24 24"><path d="M4 20 20 4"/><circle cx="4.5" cy="19.5" r="1.8"/><circle cx="19.5" cy="4.5" r="1.8"/></svg></button>
    <div class="sp"></div>
    <button class="b" id="alertBtn" aria-label="alert"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg></button>
  </div>
  <div id="pages">
    <div class="page on" id="pgChart">
      <div id="chartWrap">
        <div id="chart"></div>
        <div id="legend"></div>
        <svg id="flogo" viewBox="0 0 755 299" aria-hidden="true"><path fill-rule="evenodd" d="M77.2 295.8L125.5 295.8L297.5 127.2L297.8 222.2L226 222.5L204.8 243L297.5 243.2L297.8 295.8L353.2 295.8L353.8 128L480.5 127L483.2 127.5L368.5 296L645.8 296.2L662.2 294.5L678 290.5L696.2 282.5L712.2 271.8L726.5 258L738.2 241.8L746.8 223.8L751.5 206.8L753.2 193.8L753.2 177.5L752 167L749.8 156.8L746.2 146L740.5 133.5L735.8 125.5L728.2 115.2L720.5 106.8L710.8 98.2L702.2 92.2L690 85.5L679 81L661 76.5L650.5 75.2L635.5 75.2L622 77L612.5 79.2L601 83.2L590.5 88.2L573.2 99.8L567 105.2L557.2 115.8L550 125.8L544.8 134.8L540 145.2L536.8 154.8L534.5 164L532.8 176.5L532.5 190.5L533.2 199.5L535.5 211.8L538.8 222.2L600.2 222.2L597.2 218.8L591.8 209.5L588.8 201.5L587 193.2L586.5 183.8L587.2 176L589.5 167.2L592.8 159.8L597.2 152.5L602.5 146.2L606.8 142.2L615 136.5L622.2 133L629.2 130.8L638.5 129.2L647.2 129.2L661 132L674.5 138.8L685.5 148.5L691.2 156.2L694.8 163L697.5 170.8L699.2 180.2L698.8 194.8L694.8 208.2L690.2 216.5L685 223.2L677.5 230.2L669.5 235.5L660 239.5L649.5 241.8L452.2 243.5L452 242.8L564.2 75.2L297.8 75.2ZM275.8 75.2L55.5 75.2L55.2 295.5L108.2 242.8L108 126.8L224 126.8ZM349.2 2L1.8 2.5L55.2 56.5L294 56.5Z"/></svg>
        <div id="loading"><div class="spin"></div></div>
        <div id="chartMsg"></div>
        <div id="drawHint"></div>
      </div>
      <div id="subs"></div>
    </div>
    <div class="page" id="pgWatch">
      <div class="hd"><h2 data-t="Котировки"></h2><button class="btn" id="wEdit" data-t="Изменить"></button><button class="btn pri" id="wAdd">＋</button></div>
      <div class="list" id="wList"></div>
    </div>
    <div class="page" id="pgAlerts">
      <div class="hd"><h2 data-t="Алерты"></h2><button class="btn pri" id="aAdd">＋</button></div>
      <div class="list" id="aList"></div>
    </div>
    <div class="page" id="pgSet">
      <div class="hd"><h2 data-t="Настройки"></h2></div>
      <div class="list" id="sList"></div>
    </div>
  </div>
  <div id="nav">
    <button data-p="pgChart" class="on"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/></svg><span data-t="График"></span></button>
    <button data-p="pgWatch"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg><span data-t="Котировки"></span></button>
    <button data-p="pgAlerts"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg><span data-t="Алерты"></span></button>
    <button data-p="pgSet"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span data-t="Настройки"></span></button>
  </div>
</div>
<div id="ov"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="sh"><h3 id="shT"></h3><button class="cl" id="shX">✕</button></div><div class="sb" id="shB"></div></div>
<div id="toast"></div>
<script src="lightweight-charts.js"></script>
<script src="app.js"></script>
</body>
</html>
