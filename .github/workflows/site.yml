name: Deploy Fazo website
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fbf9561b403b9ff9ce461cfa70e9d4a2
          command: pages deploy site --project-name=fazo-terminal --branch=main --commit-dirty=true
